[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["lzma"]

[[redirects]]
  from = "/api/market-candles"
  to = "/.netlify/functions/market-candles"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
